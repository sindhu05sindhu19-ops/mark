<!DOCTYPE html>
<html>
<head>
<title>My portfolio</title>
<style>
body{
font-family:Arial;
margin:0;
background:#f0f8ff;
}
/*header using Flexbox*/
header{
display:flex;
justify-content:space-between;
align-items:center;
background:#4CAF50;
color:white;
padding:15px;
}
nav a {
color:white;
margin:10px;
text-decoration:none;
font-weight:bold;
}
/*section*/
section{
padding:25px;
text-align:center;
}
/*skills using Grid*/
.skills{
display:grid;
grid-template-columns:auto auto auto;
gap:15px;
margin-top:10px;
}
.skills div{
background:#2196f3;
color:white;
padding:15px;
border-radius:5px;
}
footer{
background:#333;
color:white;
text-align:center;
padding:10px;
}
</style>
</head>
<body>
<header>
<h2>My portfolio</h2>
<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>
</header>
<section>
<h3>About me</h3>
<p>Hello! i am student learning web development.</p>
</section>
<section>
<h3>skills</h3>
<div class="skills">
<div>HTML</div>
<div>CSS</div>
<div>Javascript</div>
</div>
</section>
<footer>
<p>Email:student@email.com</p>
</footer>
</body>
</html>
